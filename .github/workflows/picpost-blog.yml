name: PicPost EZ Daily Blog

on:
  schedule:
    - cron: '30 0 * * *' # 09:30 Korea time (UTC+9)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picpost-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenAI SDK
        run: python -m pip install 'openai>=1.0.0,<3.0.0'
      - name: Generate PicPost EZ article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_picpost_blog.py
      - name: Commit blog updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add picpost/blog/
          if git diff --cached --quiet; then
            echo 'No new blog content.'
            exit 0
          fi
          git commit -m 'Publish PicPost EZ blog article'
          git push
